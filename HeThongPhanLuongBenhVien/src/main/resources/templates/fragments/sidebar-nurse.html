<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Sidebar cho Bác sĩ / Y tá -->
<aside th:fragment="sidebar" class="fixed left-0 top-0 h-screen w-64 bg-white border-r border-slate-200 flex flex-col z-40">

    <!-- Logo -->
    <div class="p-5 border-b border-slate-100">
        <a href="/nurse/queue" class="flex items-center gap-3">
            <div class="w-10 h-10 bg-gradient-to-br from-primary to-primary-dark rounded-xl flex items-center justify-center shadow-sm">
                <i data-lucide="heart-pulse" class="w-6 h-6 text-white"></i>
            </div>
            <div>
                <span class="text-lg font-bold gradient-text">MedAssist</span>
                <span class="text-xs text-slate-400 block -mt-1 font-medium" th:text="${userRoleLabel} ?: 'Bác sĩ / Y tá'">Y tá / Lễ tân</span>
            </div>
        </a>
    </div>

    <!-- Menu -->
    <nav class="flex-1 p-4 space-y-1">
        <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider px-3 mb-2">Lâm sàng & Hàng đợi</p>
        <a href="/nurse/queue" class="sidebar-link flex items-center gap-3"
           th:classappend="${currentPage == 'queue'} ? 'active' : 'text-slate-600'">
            <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
            <span class="text-sm font-medium">Hàng đợi khám</span>
        </a>

        <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider px-3 mb-2 mt-6">Lịch trực & Ca làm</p>
        <a href="/nurse/schedule" class="sidebar-link flex items-center gap-3"
           th:classappend="${currentPage == 'schedule'} ? 'active' : 'text-slate-600'">
            <i data-lucide="calendar-clock" class="w-5 h-5"></i>
            <span class="text-sm font-medium">Lịch trực & Phân ca</span>
        </a>

        <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider px-3 mb-2 mt-6">Bệnh nhân</p>
        <a href="/nurse/search" class="sidebar-link flex items-center gap-3"
           th:classappend="${currentPage == 'search'} ? 'active' : 'text-slate-600'">
            <i data-lucide="search" class="w-5 h-5"></i>
            <span class="text-sm font-medium">Tra cứu hồ sơ</span>
        </a>
    </nav>

    <!-- User Info & Shift Badge -->
    <div class="p-4 border-t border-slate-100">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full flex items-center justify-center text-white text-sm font-bold shadow-sm"
                 th:classappend="${userRole == 'DOCTOR'} ? 'bg-gradient-to-br from-blue-500 to-indigo-600' : 'bg-gradient-to-br from-emerald-500 to-teal-600'">
                <span th:text="${userName != null ? #strings.substring(userName, 0, 1) : 'U'}">N</span>
            </div>
            <div class="flex-1 min-w-0">
                <p class="text-sm font-bold text-slate-800 truncate" th:text="${userName}">Y tá Nga</p>
                <p class="text-xs text-primary font-medium truncate" th:text="${userDept}">Khoa Cấp Cứu</p>
            </div>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="p-2 hover:bg-rose-50 text-slate-400 hover:text-rose-600 rounded-lg transition-all" title="Đăng xuất">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                </button>
            </form>
        </div>

        <!-- Shift Pill in Sidebar -->
        <div th:if="${currentShift != null}" class="mt-3 p-2.5 rounded-xl bg-emerald-50/70 border border-emerald-100 flex items-center justify-between">
            <div class="flex items-center gap-1.5 min-w-0">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse shrink-0"></span>
                <span class="text-[11px] font-bold text-emerald-800 truncate" th:text="${currentShift.shiftType.label}">Ca Sáng</span>
            </div>
            <span class="text-[10px] text-emerald-600 font-semibold shrink-0" th:text="${currentShift.roomNumber}">P.201</span>
        </div>
    </div>
</aside>
</body>
</html>
