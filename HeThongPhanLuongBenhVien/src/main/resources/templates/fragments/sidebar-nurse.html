<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Sidebar cho Y tá / Lễ tân -->
<aside th:fragment="sidebar" class="fixed left-0 top-0 h-screen w-64 bg-white border-r border-slate-200 flex flex-col z-40">

    <!-- Logo -->
    <div class="p-5 border-b border-slate-100">
        <a href="/nurse/queue" class="flex items-center gap-3">
            <div class="w-10 h-10 bg-gradient-to-br from-primary to-primary-dark rounded-xl flex items-center justify-center">
                <i data-lucide="heart-pulse" class="w-6 h-6 text-white"></i>
            </div>
            <div>
                <span class="text-lg font-bold gradient-text">MedAssist</span>
                <span class="text-xs text-slate-400 block -mt-1">Y tá / Lễ tân</span>
            </div>
        </a>
    </div>

    <!-- Menu -->
    <nav class="flex-1 p-4 space-y-1">
        <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider px-3 mb-2">Quản lý hàng đợi</p>
        <a href="/nurse/queue" class="sidebar-link flex items-center gap-3"
           th:classappend="${currentPage == 'queue'} ? 'active' : 'text-slate-600'">
            <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
            <span class="text-sm font-medium">Dashboard hàng đợi</span>
        </a>

        <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider px-3 mb-2 mt-6">Bệnh nhân</p>
        <a href="/nurse/search" class="sidebar-link flex items-center gap-3"
           th:classappend="${currentPage == 'search'} ? 'active' : 'text-slate-600'">
            <i data-lucide="search" class="w-5 h-5"></i>
            <span class="text-sm font-medium">Tra cứu hồ sơ</span>
        </a>
    </nav>

    <!-- User Info -->
    <div class="p-4 border-t border-slate-100">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 bg-gradient-to-br from-green-500 to-emerald-600 rounded-full flex items-center justify-center">
                <span class="text-white text-sm font-bold" th:text="${#strings.substring(userName, 0, 1)}">N</span>
            </div>
            <div class="flex-1 min-w-0">
                <p class="text-sm font-medium text-slate-700 truncate" th:text="${userName}">Y tá Nga</p>
                <p class="text-xs text-slate-400" th:text="${userDept}">Khoa Cấp Cứu</p>
            </div>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="p-2 hover:bg-red-50 rounded-lg transition-all" title="Đăng xuất">
                    <i data-lucide="log-out" class="w-4 h-4 text-red-400"></i>
                </button>
            </form>
        </div>
    </div>
</aside>
</body>
</html>
