<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/head :: head('Hàng đợi chi tiết')}"></head>
<body class="min-h-screen bg-medical-bg">
    <div th:replace="~{fragments/sidebar-nurse :: sidebar}"></div>

    <main class="ml-64 p-8">
        <!-- Back + Header -->
        <a href="/nurse/queue" class="inline-flex items-center gap-2 text-sm text-slate-500 hover:text-primary mb-4 transition-all">
            <i data-lucide="arrow-left" class="w-4 h-4"></i> Quay lại Dashboard
        </a>
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-2xl font-extrabold text-slate-800" th:text="${department.name}">Khoa Cấp Cứu</h1>
                <p class="text-sm text-slate-500" th:text="${department.building} + ' — Tầng ' + ${department.floor} + ' — Phòng ' + ${department.roomNumbers}">Tòa A — Tầng 1</p>
            </div>
            <div class="flex items-center gap-3">
                <div class="bg-blue-50 px-4 py-2 rounded-xl text-center">
                    <p class="text-2xl font-extrabold text-primary" th:text="${waitingCount}">8</p>
                    <p class="text-[10px] text-slate-400 uppercase">Đang chờ</p>
                </div>
                <div class="bg-emerald-50 px-4 py-2 rounded-xl text-center">
                    <p class="text-2xl font-extrabold text-emerald-600" th:text="${calledCount}">1</p>
                    <p class="text-[10px] text-slate-400 uppercase">Đang khám</p>
                </div>
            </div>
        </div>

        <!-- Call Next Button -->
        <form th:action="@{/nurse/queue/{deptId}/call-next(deptId=${department.id})}" method="post" class="mb-6">
            <button type="submit"
                    class="px-8 py-3 bg-gradient-to-r from-primary to-primary-dark text-white font-bold rounded-xl shadow-lg hover:shadow-xl transition-all text-sm flex items-center gap-2">
                <i data-lucide="megaphone" class="w-5 h-5"></i>
                📢 Gọi số tiếp theo
            </button>
        </form>

        <!-- Queue Table -->
        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="bg-slate-50 text-left text-xs text-slate-400 uppercase tracking-wider">
                            <th class="px-6 py-4">STT</th>
                            <th class="px-6 py-4">Bệnh nhân</th>
                            <th class="px-6 py-4">Mã BHYT</th>
                            <th class="px-6 py-4 text-center">Khẩn cấp</th>
                            <th class="px-6 py-4 text-center">Trạng thái</th>
                            <th class="px-6 py-4">Thời gian</th>
                            <th class="px-6 py-4 text-center">Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="t : ${tickets}" class="border-t border-slate-50 hover:bg-slate-50/50 transition-all">
                            <td class="px-6 py-4">
                                <span class="text-lg font-extrabold text-slate-800" th:text="${t.ticketNumber}">001</span>
                            </td>
                            <td class="px-6 py-4">
                                <p class="font-semibold text-slate-800" th:text="${t.patientName}">Nguyễn Văn A</p>
                            </td>
                            <td class="px-6 py-4 text-slate-500 font-mono text-xs" th:text="${t.bhytNumber}">HN479000001</td>
                            <td class="px-6 py-4 text-center">
                                <span class="text-xs font-semibold px-3 py-1 rounded-full"
                                      th:classappend="${t.severity == 'EMERGENCY'} ? 'badge-emergency' : (${t.severity == 'MEDIUM'} ? 'badge-medium' : 'badge-normal')"
                                      th:text="${t.severity}">NORMAL</span>
                            </td>
                            <td class="px-6 py-4 text-center">
                                <span class="text-xs font-semibold px-3 py-1 rounded-full"
                                      th:classappend="${t.status == 'WAITING'} ? 'status-waiting' : (${t.status == 'CALLED'} ? 'status-called' : 'status-done')"
                                      th:text="${t.status == 'WAITING'} ? 'Chờ khám' : (${t.status == 'CALLED'} ? 'Đang khám' : 'Hoàn tất')">Chờ khám</span>
                            </td>
                            <td class="px-6 py-4 text-slate-500 text-xs" th:text="${#temporals.format(t.createdAt, 'HH:mm')}">09:30</td>
                            <td class="px-6 py-4 text-center">
                                <div class="flex items-center justify-center gap-2">
                                    <!-- Gọi số -->
                                    <form th:if="${t.status == 'WAITING'}" th:action="@{/nurse/queue/{id}/call(id=${t.id})}" method="post">
                                        <button type="submit" class="p-2 bg-primary/10 text-primary rounded-lg hover:bg-primary/20 transition-all" title="Gọi bệnh nhân">
                                            <i data-lucide="phone-call" class="w-4 h-4"></i>
                                        </button>
                                    </form>
                                    <!-- Chuyển khoa -->
                                    <button th:if="${t.status == 'WAITING' or t.status == 'CALLED'}" onclick="openTransfer(this)"
                                            th:data-ticket-id="${t.id}" th:data-patient-name="${t.patientName}"
                                            class="p-2 bg-orange-50 text-orange-500 rounded-lg hover:bg-orange-100 transition-all" title="Chuyển khoa">
                                        <i data-lucide="arrow-right-left" class="w-4 h-4"></i>
                                    </button>
                                    <!-- Hoàn tất -->
                                    <form th:if="${t.status == 'CALLED'}" th:action="@{/nurse/queue/{id}/done(id=${t.id})}" method="post">
                                        <button type="submit" class="p-2 bg-emerald-50 text-emerald-500 rounded-lg hover:bg-emerald-100 transition-all" title="Hoàn tất khám">
                                            <i data-lucide="check-circle" class="w-4 h-4"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Transfer Modal -->
    <div id="transferModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden items-center justify-center flex" x-data>
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 mx-4">
            <h3 class="text-lg font-bold text-slate-800 mb-1">🔄 Chuyển khoa</h3>
            <p class="text-sm text-slate-500 mb-4">Chuyển bệnh nhân <strong id="transferPatientName"></strong> sang khoa khác</p>
            <form th:action="@{/nurse/queue/transfer}" method="post" class="space-y-4">
                <input type="hidden" name="ticketId" id="transferTicketId">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">Chọn khoa mới</label>
                    <select name="newDepartmentId" required
                            class="w-full py-3 px-4 rounded-xl border border-slate-200 bg-slate-50 focus:border-primary outline-none text-sm">
                        <option value="">-- Chọn khoa --</option>
                        <option th:each="d : ${allDepartments}" th:value="${d.id}" th:text="${d.name}">Khoa Tim Mạch</option>
                    </select>
                </div>
                <div class="flex gap-3">
                    <button type="submit" class="flex-1 py-2.5 bg-gradient-to-r from-primary to-primary-dark text-white font-semibold rounded-xl text-sm">
                        Xác nhận chuyển
                    </button>
                    <button type="button" onclick="closeTransfer()" class="px-4 py-2.5 border border-slate-200 text-slate-600 rounded-xl text-sm hover:bg-slate-50">
                        Hủy
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        lucide.createIcons();

        function openTransfer(btn) {
            document.getElementById('transferTicketId').value = btn.dataset.ticketId;
            document.getElementById('transferPatientName').textContent = btn.dataset.patientName;
            document.getElementById('transferModal').classList.remove('hidden');
        }
        function closeTransfer() {
            document.getElementById('transferModal').classList.add('hidden');
        }
    </script>
</body>
</html>
