<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/head :: head('Dashboard Hàng đợi')}"></head>
<body class="min-h-screen bg-medical-bg">

    <div th:replace="~{fragments/sidebar-nurse :: sidebar}"></div>

    <!-- Main content (offset by sidebar width) -->
    <main class="ml-64 p-8">
        <!-- Header -->
        <div class="flex items-center justify-between mb-8">
            <div>
                <h1 class="text-2xl font-extrabold text-slate-800">📊 Dashboard Hàng đợi</h1>
                <p class="text-sm text-slate-500 mt-1">Tổng quan hàng đợi tất cả các Khoa</p>
            </div>
            <div class="flex items-center gap-2 text-sm text-slate-500">
                <i data-lucide="clock" class="w-4 h-4"></i>
                <span id="currentTime"></span>
            </div>
        </div>

        <!-- Stats Row -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div class="bg-white rounded-2xl border border-slate-100 p-5 card-hover">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-xs text-slate-400 font-medium uppercase tracking-wider">Tổng đang chờ</p>
                        <p class="text-3xl font-extrabold text-slate-800 mt-1" th:text="${totalWaiting}">24</p>
                    </div>
                    <div class="w-12 h-12 bg-blue-50 rounded-2xl flex items-center justify-center">
                        <i data-lucide="users" class="w-6 h-6 text-blue-500"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-2xl border border-slate-100 p-5 card-hover">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-xs text-slate-400 font-medium uppercase tracking-wider">Đang khám</p>
                        <p class="text-3xl font-extrabold text-emerald-600 mt-1" th:text="${totalCalled}">5</p>
                    </div>
                    <div class="w-12 h-12 bg-emerald-50 rounded-2xl flex items-center justify-center">
                        <i data-lucide="stethoscope" class="w-6 h-6 text-emerald-500"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-2xl border border-slate-100 p-5 card-hover">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-xs text-slate-400 font-medium uppercase tracking-wider">Đã khám xong</p>
                        <p class="text-3xl font-extrabold text-slate-800 mt-1" th:text="${totalDone}">18</p>
                    </div>
                    <div class="w-12 h-12 bg-slate-100 rounded-2xl flex items-center justify-center">
                        <i data-lucide="check-circle" class="w-6 h-6 text-slate-500"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-2xl border border-slate-100 p-5 card-hover">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-xs text-slate-400 font-medium uppercase tracking-wider">Cấp cứu</p>
                        <p class="text-3xl font-extrabold text-red-500 mt-1" th:text="${totalEmergency}">2</p>
                    </div>
                    <div class="w-12 h-12 bg-red-50 rounded-2xl flex items-center justify-center">
                        <i data-lucide="siren" class="w-6 h-6 text-red-500"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Department Queue Cards -->
        <h2 class="text-lg font-bold text-slate-800 mb-4">Hàng đợi theo Khoa</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <a th:each="dept : ${departments}" th:href="@{/nurse/queue/{id}(id=${dept.id})}"
               class="bg-white rounded-2xl border border-slate-100 p-5 card-hover block">
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-10 h-10 bg-gradient-to-br from-primary/10 to-accent/10 rounded-xl flex items-center justify-center">
                        <i data-lucide="building-2" class="w-5 h-5 text-primary"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-slate-800 text-sm" th:text="${dept.name}">Khoa Cấp Cứu</h3>
                        <p class="text-xs text-slate-400" th:text="${dept.building} + ' — T' + ${dept.floor}">Tòa A — T1</p>
                    </div>
                </div>
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <div class="text-center">
                            <p class="text-2xl font-extrabold text-primary" th:text="${dept.waitingCount}">8</p>
                            <p class="text-[10px] text-slate-400 uppercase">Chờ</p>
                        </div>
                        <div class="w-px h-8 bg-slate-200"></div>
                        <div class="text-center">
                            <p class="text-2xl font-extrabold text-emerald-600" th:text="${dept.calledCount}">1</p>
                            <p class="text-[10px] text-slate-400 uppercase">Đang khám</p>
                        </div>
                    </div>
                    <i data-lucide="chevron-right" class="w-5 h-5 text-slate-300"></i>
                </div>
            </a>
        </div>
    </main>

    <script>
        lucide.createIcons();
        // Update clock
        function updateClock() {
            const now = new Date();
            document.getElementById('currentTime').textContent = now.toLocaleTimeString('vi-VN') + ' — ' + now.toLocaleDateString('vi-VN');
        }
        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
