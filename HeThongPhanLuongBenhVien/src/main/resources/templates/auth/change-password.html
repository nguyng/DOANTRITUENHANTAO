<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/head :: head('Đổi mật khẩu')}"></head>
<body class="min-h-screen bg-medical-bg flex flex-col">
    <div th:replace="~{fragments/navbar-patient :: navbar}"></div>

    <main class="flex-1 max-w-md w-full mx-auto px-4 py-12">
        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-8">
            <div class="text-center mb-6">
                <div class="w-14 h-14 bg-primary/10 rounded-2xl flex items-center justify-center mx-auto mb-3">
                    <i data-lucide="key" class="w-7 h-7 text-primary"></i>
                </div>
                <h1 class="text-xl font-extrabold text-slate-800">Đổi mật khẩu</h1>
                <p class="text-sm text-slate-500 mt-1">Vui lòng đổi mật khẩu mặc định để bảo mật tài khoản</p>
            </div>

            <!-- Success -->
            <div th:if="${success}" class="mb-4 p-3 bg-emerald-50 border border-emerald-200 rounded-xl flex items-center gap-2">
                <i data-lucide="check-circle" class="w-5 h-5 text-emerald-500 flex-shrink-0"></i>
                <span class="text-sm text-emerald-700" th:text="${success}">Đổi mật khẩu thành công!</span>
            </div>
            <!-- Error -->
            <div th:if="${error}" class="mb-4 p-3 bg-red-50 border border-red-200 rounded-xl flex items-center gap-2">
                <i data-lucide="alert-circle" class="w-5 h-5 text-red-500 flex-shrink-0"></i>
                <span class="text-sm text-red-600" th:text="${error}">Mật khẩu cũ không đúng</span>
            </div>

            <form th:action="@{/change-password}" method="post" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">Mật khẩu hiện tại</label>
                    <div class="relative">
                        <i data-lucide="lock" class="w-5 h-5 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                        <input type="password" name="currentPassword" required placeholder="Nhập mật khẩu hiện tại"
                               class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">Mật khẩu mới</label>
                    <div class="relative">
                        <i data-lucide="key" class="w-5 h-5 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                        <input type="password" name="newPassword" required minlength="6" placeholder="Tối thiểu 6 ký tự"
                               class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">Xác nhận mật khẩu mới</label>
                    <div class="relative">
                        <i data-lucide="key" class="w-5 h-5 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                        <input type="password" name="confirmPassword" required minlength="6" placeholder="Nhập lại mật khẩu mới"
                               class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all text-sm">
                    </div>
                </div>
                <button type="submit"
                        class="w-full py-3 bg-gradient-to-r from-primary to-primary-dark text-white font-semibold rounded-xl shadow-lg hover:shadow-xl transition-all text-sm">
                    Đổi mật khẩu
                </button>
            </form>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script>lucide.createIcons();</script>
</body>
</html>
