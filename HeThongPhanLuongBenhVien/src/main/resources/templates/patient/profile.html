<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/head :: head('Thông tin cá nhân')}"></head>
<body class="min-h-screen bg-medical-bg flex flex-col">
    <div th:replace="~{fragments/navbar-patient :: navbar}"></div>

    <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8">
        <h1 class="text-2xl font-extrabold text-slate-800 mb-6">📋 Thông tin cá nhân</h1>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Personal Info -->
            <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-6">
                <h2 class="font-bold text-slate-800 mb-4 flex items-center gap-2">
                    <i data-lucide="user" class="w-5 h-5 text-primary"></i> Hồ sơ cá nhân
                </h2>
                <div class="space-y-3">
                    <div class="flex justify-between py-2 border-b border-slate-50">
                        <span class="text-sm text-slate-500">Họ và tên</span>
                        <span class="text-sm font-semibold text-slate-800" th:text="${user.fullName}">Nguyễn Thị Lan</span>
                    </div>
                    <div class="flex justify-between py-2 border-b border-slate-50">
                        <span class="text-sm text-slate-500">Ngày sinh</span>
                        <span class="text-sm text-slate-700" th:text="${user.dob != null} ? ${#temporals.format(user.dob, 'dd/MM/yyyy')} : 'Chưa cập nhật'">25/11/1992</span>
                    </div>
                    <div class="flex justify-between py-2 border-b border-slate-50">
                        <span class="text-sm text-slate-500">Giới tính</span>
                        <span class="text-sm text-slate-700" th:text="${user.gender}">Nữ</span>
                    </div>
                    <div class="flex justify-between py-2 border-b border-slate-50">
                        <span class="text-sm text-slate-500">Số điện thoại</span>
                        <span class="text-sm text-slate-700" th:text="${user.phone} ?: 'Chưa cập nhật'">0912345678</span>
                    </div>
                    <div class="flex justify-between py-2 border-b border-slate-50">
                        <span class="text-sm text-slate-500">Email</span>
                        <span class="text-sm text-slate-700" th:text="${user.email} ?: 'Chưa cập nhật'">lan@email.com</span>
                    </div>
                    <div class="flex justify-between py-2">
                        <span class="text-sm text-slate-500">Địa chỉ</span>
                        <span class="text-sm text-slate-700 text-right max-w-[200px]" th:text="${user.address} ?: 'Chưa cập nhật'">TP.HCM</span>
                    </div>
                </div>
            </div>

            <!-- BHYT Card -->
            <div class="bg-gradient-to-br from-primary to-primary-dark rounded-2xl shadow-xl p-6 text-white relative overflow-hidden">
                <div class="absolute -top-10 -right-10 w-40 h-40 bg-white/5 rounded-full"></div>
                <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-white/5 rounded-full"></div>

                <div class="relative">
                    <div class="flex items-center gap-2 mb-4">
                        <i data-lucide="shield-check" class="w-5 h-5 text-white/80"></i>
                        <h2 class="font-bold">Thẻ Bảo hiểm Y tế</h2>
                    </div>

                    <div class="space-y-3">
                        <div>
                            <p class="text-xs text-white/50 uppercase tracking-wider">Mã BHYT</p>
                            <p class="text-xl font-extrabold tracking-widest mt-0.5" th:text="${user.bhytNumber}">DN47900000001</p>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <p class="text-xs text-white/50">Đối tượng</p>
                                <p class="text-sm font-semibold mt-0.5" th:text="${user.bhytObjectName} ?: 'N/A'">Người lao động</p>
                            </div>
                            <div>
                                <p class="text-xs text-white/50">Mức giảm BH</p>
                                <p class="text-sm font-semibold mt-0.5" th:text="${user.bhytDiscountRate != null} ? ${#numbers.formatPercent(user.bhytDiscountRate, 0, 0)} : 'N/A'">80%</p>
                            </div>
                        </div>
                        <div>
                            <p class="text-xs text-white/50">Hạn sử dụng</p>
                            <div class="flex items-center gap-2 mt-0.5">
                                <p class="text-sm font-semibold" th:text="${user.bhytExpiryDate != null} ? ${#temporals.format(user.bhytExpiryDate, 'dd/MM/yyyy')} : 'N/A'">31/12/2026</p>
                                <!-- Cảnh báo sắp hết hạn -->
                                <span th:if="${bhytExpiringSoon}" class="text-xs bg-yellow-400 text-yellow-900 px-2 py-0.5 rounded-full font-semibold">⚠️ Sắp hết hạn</span>
                                <span th:if="${bhytExpired}" class="text-xs bg-red-500 text-white px-2 py-0.5 rounded-full font-semibold">❌ Đã hết hạn</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script>lucide.createIcons();</script>
</body>
</html>
