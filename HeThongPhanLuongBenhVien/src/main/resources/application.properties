spring.application.name=HeThongPhanLuongBenhVien
# Cau hinh ket noi Database PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/hospital_db
spring.datasource.username=postgres
spring.datasource.password=29061612

# Cau hinh Hibernate / JPA
# none: Hibernate KHONG dong vao schema - DB quan ly boi database.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
server.port=8081
# ── AI Hybrid Gateway Configuration (Enterprise Cloud + Local Edge) ──────────
# Provider: 'hybrid' (Gemini Cloud ưu tiên -> Ollama Edge dự phòng), 'gemini', 'ollama'
ai.provider=hybrid

# 1. Cloud Engine: Google Gemini API (Phản hồi nhanh <1s, suy luận sâu, JSON Schema)
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
ai.gemini.url=https://generativelanguage.googleapis.com/v1beta/models

# 2. Local Edge Engine: Ollama (Dự phòng Offline / Bảo mật On-Premise)
ai.service.url=${OLLAMA_URL:http://localhost:11434}
ai.model.name=${OLLAMA_MODEL:qwen2.5-coder:3b}
